[bar.default]
background_opacity = 0.84999998100101948
capsule_radius = 0
center = []
concave_edge_corners = false
end = [
    "summary",
    "divider",
    "tray",
    "divider",
    "recorder",
    "wallhaven",
    "network",
    "volume",
    "notifications",
    "divider",
    "clock"
]
font_family = "JetBrainsMono NF"
font_weight = 400
margin_ends = 0
radius = 0
start = [ "workspaces", "divider", "active_window", "audio_visualizer" ]

[dock]
auto_hide = true
background_opacity = 0.84999998100101948
concave_edge_corners = false
enabled = true
icon_size = 36
launcher_position = "start"
pinned = [
    "thunar",
    "zen",
    "discord",
    "spotify",
    "kitty",
    "dev.zed.Zed",
    "steam",
    "io.github.Faugus.faugus-launcher"
]
radius = 7
radius_bottom_left = 0
radius_bottom_right = 0
reserve_space = false
show_dots = true

[location]
address = "Ho Chi Minh"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.84999998100101948
history_retention_hours = 72
max_visible = 2

[osd]
background_opacity = 0.84999998100101948
offset_y = 100
position = "bottom_center"
position_vertical = "bottom_center"

[plugins]
enabled = [ "noctalia/wallhaven", "tmelik/system-monitor", "noctalia/screen_recorder" ]

[shell]
corner_radius_scale = 0.0
font_family = "JetBrainsMono NF"
polkit_agent = true
telemetry_enabled = true

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

[theme]
builtin = "Gruvbox"
community_palette = "Cherry Blossom"
mode = "dark"
source = "builtin"
wallpaper_scheme = "dysfunctional"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kitty", "qt", "umbriel" ]
    community_ids = [ "zen-browser", "obsidian", "zed", "steam", "fastfetch" ]

[wallpaper.default]
path = "/home/jensend/Pictures/wallhaven-e82xxr.jpg"

[wallpaper.last]
path = "/home/jensend/Pictures/wallhaven-e82xxr.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/jensend/Pictures/wallhaven-e82xxr.jpg"

[widget.active_window]
display = "text_only"
show_empty_label = true

[widget.audio_visualizer]
centered = false
mirrored = false

[widget.clock]
anchor = true

[widget.divider]
color = "#5A595A"
interactive = false
text = "|"
type = "text"

[widget.network]
show_label = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.summary]
show_cpu_details_in_tooltip = true
show_cpu_usage = false
show_disk = false
show_download = false
show_gpu_usage = "off"
show_gpu_vram = "off"
show_ram = false
show_separators = false
show_swap = false
show_top_processes = false
show_upload = false
type = "tmelik/system-monitor:summary"

[widget.volume]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
focused_color = "#11A363"
label_source = "name"
max_label_chars = 5
