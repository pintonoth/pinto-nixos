# Umbriel configuration. Changes apply on save.
# See https://docs.noctalia.dev/umbriel/ for the full reference.

[include]
files = [
    "keybinds.toml",
    "windowrules.toml",
    "outputs.toml"
]

[general]
autostart = ["noctalia"]
mod_key = "Super"
xwayland = true
show_cheatsheet = true
focus_on_activate = false
honor_restored_maximize = false

[workspaces]
back_and_forth = false

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 10
animation_ms = 250

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2
color = "#0000007F"

[overview]
zoom = 0.5

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

[hot_corners.top_right]
enabled = false
delay_ms = 500
action = "overview-close"

[hot_corners.bottom_left]
enabled = false
delay_ms = 500
action = "overview-toggle"

[hot_corners.bottom_right]
enabled = false
delay_ms = 500
action = "spawn:notify-send 'Bottom right'"

[layout]
mode = "scrolling"
gap = 14
width_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_width_fraction = 0.5
center_underfull_strip = true

[input]
middle_click_paste = true

[input.keyboard]
layout = ""
variant = ""
options = ""
repeat_rate = 25
repeat_delay = 600

[input.touchpad]
tap = true

[input.mouse]
accel_profile = "flat"
sensitivity = 0.0
scroll_wheel_step = 60

[input.tablet]
enabled = true

[input.cursor]
theme = ""
size = 24
hardware_cursor = true
hide_when_typing = false
hide_timeout_ms = 0

[input.focus]
follows_mouse = true

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false
