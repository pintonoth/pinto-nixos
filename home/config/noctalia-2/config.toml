[bar.default]
background_opacity = 0.84999998100101948
capsule_radius = 0
center = [ "summary" ]
concave_edge_corners = false
end = [
    "weather",
    "divider",
    "tray",
    "clipboard",
    "recorder",
    "wallhaven",
    "network",
    "volume",
    "notifications",
    "divider",
    "clock"
]
font_family = "JetBrainsMono NF"
font_weight = 400
margin_ends = 0
radius = 0
start = [ "workspaces", "divider", "indicator", "divider", "active_window", "audio_visualizer" ]

[desktop_widgets]
enabled = false

[dock]
background_opacity = 0.84999998100101948
concave_edge_corners = false
cross_axis_padding = 6
enabled = true
icon_size = 42
item_spacing = 0
launcher_position = "start"
main_axis_padding = 6
pinned = [
    "thunar",
    "chromium-browser",
    "kitty",
    "com.discordapp.Discord",
    "com.spotify.Client",
    "com.heroicgameslauncher.hgl",
    "steam",
    "dev.zed.Zed"
]
radius = 8
radius_bottom_left = 0
radius_bottom_right = 0
show_dots = true

[location]
address = "Ho Chi Minh"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.84999998100101948

[osd]
background_opacity = 0.84999998100101948
position = "bottom_center"
position_vertical = "bottom_center"

[plugins]
enabled = [ "noctalia/wallhaven", "tmelik/system-monitor", "noctalia/screen_recorder", "theblackdon/kineticwe-layouts" ]

[shell]
corner_radius_scale = 0.0
font_family = "JetBrainsMono NF"
polkit_agent = true

    [shell.launcher]
    categories = false

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

[theme]
builtin = "Tokyo-Night"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt" ]

[wallpaper.default]
path = "/home/jensend/Pictures/wallhaven-rq6x61.jpg"

[wallpaper.last]
path = "/home/jensend/Pictures/wallhaven-rq6x61.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/jensend/Pictures/wallhaven-rq6x61.jpg"

[widget.active_window]
max_length = 200
title_scroll = "on_hover"

[widget.audio_visualizer]
centered = false
mirrored = false

[widget.divider]
color = "#484848"
font_scale = 0.85000000000000009
text = "|"
type = "text"

[widget.indicator]
type = "theblackdon/kineticwe-layouts:indicator"

[widget.network]
show_label = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.summary]
show_disk = false
show_ram = false
show_swap = false
type = "tmelik/system-monitor:summary"

[widget.tray]
detached_panel = true
drawer = true
pinned = [ "Fcitx" ]

[widget.volume]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"
